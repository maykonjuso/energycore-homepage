[project]
name = "energycore-homepage-server"
version = "1.0.0"
description = "Homepage da EnergyCore: contato por e-mail, assistente de IA e site compilado"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "anthropic>=0.70", "python-dotenv>=1.0"]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
