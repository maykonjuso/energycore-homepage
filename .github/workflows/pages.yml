# Publica o site no GitHub Pages a cada push na main.
# No Pages o site é estático: sem VITE_API_URL, o contato abre o e-mail já preenchido e o assistente fica oculto.
# Para ligar contato e assistente, defina a variável de repositório VITE_API_URL com o endereço do servidor (server/).
name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx vitest run
      - name: Build
        run: npx vite build --base="/${{ github.event.repository.name }}/"
        env:
          VITE_STATIC: '1'
          VITE_API_URL: ${{ vars.VITE_API_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
