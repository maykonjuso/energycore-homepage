  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta property="og:title" content="EnergyCore · Do disjuntor ao cliente final, numa leitura só" />
    <meta property="og:description" content="Energia do datacenter e rede de telecom na mesma plataforma. O que está acontecendo, onde começou e quem foi afetado." />
    <meta property="og:image" content="%BASE_URL%produto/overview-light.webp" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta name="theme-color" content="#efece5" />
    <link rel="icon" href="%BASE_URL%brand/mark.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <script>
      // Antes de pintar (sem piscar): tema, idioma e acessibilidade guardados neste navegador.
      try {
        var el = document.documentElement
        var t = localStorage.getItem('ec-site-theme')
        if (t === 'dark') el.classList.add('dark')
        var l = localStorage.getItem('ec-site-lang') || ((navigator.language || 'pt').toLowerCase().indexOf('pt') === 0 ? 'pt' : 'en')
        el.lang = l === 'en' ? 'en' : 'pt-BR'
        var a = JSON.parse(localStorage.getItem('ec-site-a11y') || '{}')
        if (a.text && a.text !== 100) el.style.fontSize = a.text + '%'
        if (a.text >= 125) el.dataset.large = 'on'
        if (a.contrast) el.dataset.contrast = 'high'
        if (a.motion === false || matchMedia('(prefers-reduced-motion: reduce)').matches) el.dataset.motion = 'off'
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
