    <script>
      // Tema antes de pintar a página (sem piscar): escolha salva ou a do sistema.
      try {
        var t = localStorage.getItem('ec-site-theme')
        if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches) || !t) document.documentElement.classList.add('dark')
        if (t === 'light') document.documentElement.classList.remove('dark')
      } catch (e) { document.documentElement.classList.add('dark') }
    </script>
